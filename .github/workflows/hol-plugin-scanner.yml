name: HOL Plugin Scanner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@bbeac35a403ccc95459cdbe68249916e6149182c # v1.2.537
        with:
          plugin_dir: "."
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          output: ai-plugin-scanner.sarif
          upload_sarif: false
      # The composite action skips its own upload when its severity gate fails.
      # Keep that failure and publish the evidence from the calling workflow.
      - name: Preserve scanner report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-plugin-scanner-report
          path: ai-plugin-scanner.sarif
          if-no-files-found: error
      - name: Publish scanner findings
        if: always() && hashFiles('ai-plugin-scanner.sarif') != ''
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v3
        with:
          sarif_file: ai-plugin-scanner.sarif
          category: ai-plugin-scanner
